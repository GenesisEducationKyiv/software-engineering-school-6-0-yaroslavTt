filebeat.inputs:
    - type: filestream
      id: container-logs
      paths:
          - /var/lib/docker/containers/*/*.log
      parsers:
          - container:
                stream: all
                format: auto

processors:
    - add_docker_metadata:
          host: 'unix:///var/run/docker.sock'
    - decode_json_fields:
          fields: ['message']
          target: ''
          overwrite_keys: true

output.elasticsearch:
    hosts: ['https://es01:9200']
    username: elastic
    password: ${ELASTIC_PASSWORD}
    ssl:
        certificate_authorities:
            - certs/ca/ca.crt

setup.kibana:
    host: 'https://kibana:5601'
    username: elastic
    password: ${ELASTIC_PASSWORD}
    ssl:
        certificate_authorities:
            - certs/ca/ca.crt
